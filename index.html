<!doctype html>

    <meta charset="UTF-8" />

    <title>StudentOS lite</title>
    <style>
      /* 關鍵首繪：消除深色模式的黑屏空窗（JS/CSS 就緒前就是品牌底色） */
      html { background: #FBF8F4; }
      body { margin: 0; font-family: -apple-system, "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif; }

      /* 啟動骨架：React 掛載後自動被替換 */
      .boot {
        min-height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        background: #FBF8F4;
      }
      .boot svg { width: 72px; height: auto; opacity: .9; }
      .boot::after {
        content: ""; width: 28px; height: 2px;
        background: #DE886D; border-radius: 2px;
        animation: bootpulse 1.1s ease-in-out infinite;
      }
      @keyframes bootpulse { 0%,100% { opacity: .25; transform: scaleX(.6); } 50% { opacity: 1; transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .boot::after { animation: none; } }
    </style>
  </head>
